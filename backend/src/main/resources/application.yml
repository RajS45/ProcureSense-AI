spring:
  application:
    name: procuresense-ai

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  datasource:
    url: jdbc:h2:mem:procuresense
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    com.procuresense: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  security:
    jwt:
      secret: procuresense_ai_demo_secret_key_for_hs512_security_2026_secure_application_key_123456789
      expiration: 86400000

  ai-service:
    url: http://ai-service:8001
    timeout: 30000

  demo-mode: false